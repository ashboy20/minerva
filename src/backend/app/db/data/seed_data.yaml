name: 'API Testing Collection'
description: 'Collection of sample API endpoints for testing and demonstration'

variables:
  - key: 'baseUrl'
    value: 'https://jsonplaceholder.typicode.com'
  - key: 'userId'
    value: '1'
  - key: 'postId'
    value: '1'
  - key: 'commentId'
    value: '1'
  - key: 'albumId'
    value: '1'
  - key: 'photoId'
    value: '1'
  - key: 'todoId'
    value: '1'

items:
  - name: 'JSONPlaceholder Examples'
    description: 'Real working examples using JSONPlaceholder API'
    type: 'folder'
    items:
      - name: 'Get all posts'
        description: 'Fetch all posts from JSONPlaceholder'
        method: 'GET'
        url: 'https://jsonplaceholder.typicode.com/posts'
        cases:
          - name: 'Success'
            description: 'Successfully fetch all posts'
            request:
              url: 'https://jsonplaceholder.typicode.com/posts'
              headers:
                - name: 'Accept'
                  value: 'application/json'
            response:
              status_code: 200
              headers:
                - name: 'Content-Type'
                  value: 'application/json'
              body: '[{"userId": 1, "id": 1, "title": "Example Post", "body": "Example content"}]'

      - name: 'Get post by ID'
        description: 'Fetch a specific post'
        method: 'GET'
        url: 'https://jsonplaceholder.typicode.com/posts/1'
        cases:
          - name: 'Success'
            description: 'Successfully fetch post with ID 1'
            request:
              url: 'https://jsonplaceholder.typicode.com/posts/1'
              headers:
                - name: 'Accept'
                  value: 'application/json'
            response:
              status_code: 200
              headers:
                - name: 'Content-Type'
                  value: 'application/json'
              body: '{"userId": 1, "id": 1, "title": "Example Post", "body": "Example content"}'

      - name: 'Create new post'
        description: 'Create a new post'
        method: 'POST'
        url: 'https://jsonplaceholder.typicode.com/posts'
        cases:
          - name: 'Success'
            description: 'Successfully create a new post'
            request:
              url: 'https://jsonplaceholder.typicode.com/posts'
              headers:
                - name: 'Content-Type'
                  value: 'application/json'
              body: '{"title": "New Post", "body": "This is a new post", "userId": 1}'
            response:
              status_code: 201
              headers:
                - name: 'Content-Type'
                  value: 'application/json'
              body: '{"id": 101, "title": "New Post", "body": "This is a new post", "userId": 1}'

      - name: 'Update post'
        description: 'Update an existing post'
        method: 'PUT'
        url: 'https://jsonplaceholder.typicode.com/posts/1'
        cases:
          - name: 'Success'
            description: 'Successfully update post with ID 1'
            request:
              url: 'https://jsonplaceholder.typicode.com/posts/1'
              headers:
                - name: 'Content-Type'
                  value: 'application/json'
              body: '{"id": 1, "title": "Updated Post", "body": "This post has been updated", "userId": 1}'
            response:
              status_code: 200
              headers:
                - name: 'Content-Type'
                  value: 'application/json'
              body: '{"id": 1, "title": "Updated Post", "body": "This post has been updated", "userId": 1}'

      - name: 'Delete post'
        description: 'Delete an existing post'
        method: 'DELETE'
        url: 'https://jsonplaceholder.typicode.com/posts/1'
        cases:
          - name: 'Success'
            description: 'Successfully delete post with ID 1'
            request:
              url: 'https://jsonplaceholder.typicode.com/posts/1'
              headers:
                - name: 'Accept'
                  value: 'application/json'
            response:
              status_code: 200
              headers:
                - name: 'Content-Type'
                  value: 'application/json'
              body: '{}'

  - name: 'Syntax Highlighting Tests'
    description: 'Examples to test variable and path parameter syntax highlighting'
    type: 'folder'
    items:
      - name: 'Path Parameters Test'
        description: 'Test endpoint with path parameters'
        method: 'GET'
        url: '{{baseUrl}}/users/:userId/posts/:postId/comments/:commentId'
        cases:
          - name: 'Test Case'
            description: 'Test various path parameter formats'
            request:
              url: '{{baseUrl}}/users/:userId/posts/:postId/comments/:commentId'
              path_params:
                - name: 'userId'
                  value: '{{userId}}'
                - name: 'postId'
                  value: ':postId'
                - name: 'commentId'
                  value: '1'
            response:
              status_code: 200
              headers:
                - name: 'Content-Type'
                  value: 'application/json'
              body: '{"message": "Path parameter test"}'

      - name: 'Query Parameters Test'
        description: 'Test endpoint with query parameters'
        method: 'GET'
        url: '{{baseUrl}}/posts?userId={{userId}}&_limit={{limit}}&_page={{page}}'
        cases:
          - name: 'Test Case'
            description: 'Test various query parameter formats'
            request:
              url: '{{baseUrl}}/posts'
              query_params:
                - name: 'userId'
                  value: '{{userId}}'
                - name: '_limit'
                  value: '{{limit}}'
                - name: '_page'
                  value: '{{page}}'
              headers:
                - name: 'Authorization'
                  value: 'Bearer {{token}}'
                - name: 'X-API-Key'
                  value: '{{apiKey}}'
            response:
              status_code: 200
              headers:
                - name: 'Content-Type'
                  value: 'application/json'
              body: '{"message": "Query parameter test"}'

      - name: 'Mixed Parameters Test'
        description: 'Test endpoint with mixed parameter types'
        method: 'POST'
        url: '{{baseUrl}}/users/:userId/posts/:postId?_method={{method}}&_format={{format}}'
        cases:
          - name: 'Test Case'
            description: 'Test combination of path and query parameters with variables'
            request:
              url: '{{baseUrl}}/users/:userId/posts/:postId'
              path_params:
                - name: 'userId'
                  value: '{{userId}}'
                - name: 'postId'
                  value: ':postId'
              query_params:
                - name: '_method'
                  value: '{{method}}'
                - name: '_format'
                  value: '{{format}}'
              headers:
                - name: 'Content-Type'
                  value: 'application/{{contentType}}'
              body: '{"title": "{{title}}", "content": "{{content}}"}'
            response:
              status_code: 201
              headers:
                - name: 'Content-Type'
                  value: 'application/json'
              body: '{"message": "Mixed parameter test"}'
