[project]
name = "minerva-backend"
version = "0.1.0"
description = "FastAPI backend for Minerva API client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "sqlmodel>=0.0.24",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "jsonpath-ng>=1.6.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]
